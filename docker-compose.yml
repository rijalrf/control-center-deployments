version: '3.9'

networks:
  center-deployment-network:
    driver: bridge
    name: center-deployment-network

volumes:
  ccd-mysql-data:
    name: ccd-mysql-data
  ccd-backend-node-modules:
    name: ccd-backend-node-modules
  ccd-frontend-node-modules:
    name: ccd-frontend-node-modules

services:
  # ────────────────────────────────────────────
  # MySQL Database
  # ────────────────────────────────────────────
  ccd-mysql:
    image: mysql:8.0
    container_name: ccd-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ccd_root_password}
      MYSQL_DATABASE: ${DB_NAME:-ccd_db}
      MYSQL_USER: ${DB_USER:-ccd_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ccd_password}
    ports:
      - "3306:3306"
    volumes:
      - ccd-mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - center-deployment-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-ccd_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ────────────────────────────────────────────
  # Backend API (Node.js + Express)
  # ────────────────────────────────────────────
  ccd-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ccd-backend
    restart: unless-stopped
    depends_on:
      ccd-mysql:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: ccd-mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-ccd_db}
      DB_USER: ${DB_USER:-ccd_user}
      DB_PASSWORD: ${DB_PASSWORD:-ccd_password}
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:5000/api/auth/github/callback}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_ORG: ${GITHUB_ORG}
      GITHUB_CENTRAL_OWNER: ${GITHUB_CENTRAL_OWNER}
      GITHUB_CENTRAL_REPO: ${GITHUB_CENTRAL_REPO:-control-center-deployments}
      GITHUB_CENTRAL_WORKFLOW: ${GITHUB_CENTRAL_WORKFLOW:-central-deploy.yml}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_PORT: ${BACKEND_PORT:-5000}
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ccd-backend-node-modules:/app/node_modules
    networks:
      - center-deployment-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────
  # Frontend (React + Vite / Nginx in prod)
  # ────────────────────────────────────────────
  ccd-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ccd-frontend
    restart: unless-stopped
    depends_on:
      - ccd-backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/app
      - ccd-frontend-node-modules:/app/node_modules
    networks:
      - center-deployment-network
