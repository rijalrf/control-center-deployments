name: Centralized Deployment Pipeline
on:
  workflow_dispatch:
    inputs:
      target_repo_url:
        description: 'URL Clone Repositori Target'
        required: true
      target_repo_name:
        description: 'Nama Repositori Target'
        required: true
      target_repo_path:
        description: 'Path Repositori Target (owner/repo)'
        required: true
      environment:
        description: 'Target Environment'
        required: true
      environment_secret_suffix:
        description: 'Suffix Secret Key (e.g. PRODUCTION)'
        required: true
      config:
        description: 'JSON string konfigurasi env variables'
        required: false
        default: '{}'
      server_host:
        description: 'Server IP / Host'
        required: true
      server_username:
        description: 'SSH Username'
        required: true
      dockerfile_path:
        description: 'Path ke Dockerfile (relatif terhadap root repo)'
        required: false
        default: 'Dockerfile'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fetching Source Code from Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.target_repo_path }}
          token: ${{ secrets.GIT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Building Application Container Image
        run: |
          echo "Membangun image docker untuk ${{ github.event.inputs.target_repo_name }}..."
          docker build -f ${{ github.event.inputs.dockerfile_path }} -t ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ github.event.inputs.target_repo_name }}:latest .

      - name: Uploading Image to Docker Hub Registry
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          echo "Login ke Docker Hub..."
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          echo "Pushing image ke Docker Hub..."
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.inputs.target_repo_name }}:latest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Configuring Server Environment & Assets
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ github.event.inputs.server_host }}
          username: ${{ github.event.inputs.server_username }}
          key: ${{ secrets[format('SSH_KEY_{0}', github.event.inputs.environment_secret_suffix)] }}
          port: 22
          envs: CONFIG_JSON,TARGET_REPO_NAME
          script: |
            echo "Membaca konfigurasi..."
            echo "$CONFIG_JSON" > /tmp/config.json
            DEPLOY_DIR=$(python3 -c "import json, os; p='/tmp/config.json'; d=json.loads(open(p).read()) if os.path.exists(p) else {}; print(d.get('DEPLOY_DIR', '/app/${TARGET_REPO_NAME}'))")

            echo "Menyiapkan direktori aplikasi: $DEPLOY_DIR..."
            sudo mkdir -p "$DEPLOY_DIR"
            sudo chown -R $USER:$USER "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            echo "Menulis file .env..."
            mv /tmp/config.json ./config.json
            python3 -c "import json; d=json.loads(open('config.json').read()); exclude={'DEPLOY_STRATEGY', 'DEPLOY_DIR', 'COMPOSE_FILE', 'PRE_DEPLOY_COMMANDS', 'POST_DEPLOY_COMMANDS', 'DOCKERFILE_PATH'}; f=open('.env', 'w'); [f.write(f'{k}={v}\n') for k, v in d.items() if k not in exclude]"
            rm config.json

            echo "Isi .env (masked):"
            cat .env | sed 's/=.*/=***/' || true
        env:
          CONFIG_JSON: ${{ github.event.inputs.config }}
          TARGET_REPO_NAME: ${{ github.event.inputs.target_repo_name }}

      - name: Deploying Container & Verifying Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ github.event.inputs.server_host }}
          username: ${{ github.event.inputs.server_username }}
          key: ${{ secrets[format('SSH_KEY_{0}', github.event.inputs.environment_secret_suffix)] }}
          port: 22
          envs: TARGET_REPO_NAME,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,CONFIG_JSON
          script: |
            # 1. Parse config JSON using Python to determine execution parameters
            echo "$CONFIG_JSON" > /tmp/config_deploy.json
            STRATEGY=$(python3 -c "import json; d=json.loads(open('/tmp/config_deploy.json').read()); print(d.get('DEPLOY_STRATEGY', 'standard'))")
            DEPLOY_DIR=$(python3 -c "import json; d=json.loads(open('/tmp/config_deploy.json').read()); print(d.get('DEPLOY_DIR', '/app/${TARGET_REPO_NAME}'))")
            COMPOSE_FILE=$(python3 -c "import json; d=json.loads(open('/tmp/config_deploy.json').read()); print(d.get('COMPOSE_FILE', 'docker-compose.yml'))")
            
            # Write custom scripts to files to avoid shell escaping issues
            python3 -c "import json; d=json.loads(open('/tmp/config_deploy.json').read()); open('/tmp/pre_deploy.sh', 'w').write(d.get('PRE_DEPLOY_COMMANDS', ''))"
            python3 -c "import json; d=json.loads(open('/tmp/config_deploy.json').read()); open('/tmp/post_deploy.sh', 'w').write(d.get('POST_DEPLOY_COMMANDS', ''))"
            rm /tmp/config_deploy.json

            echo "Menuju direktori deployment: $DEPLOY_DIR..."
            cd "$DEPLOY_DIR"

            # 2. Login Docker Hub
            IMAGE_NAME="${DOCKERHUB_USERNAME}/${TARGET_REPO_NAME}:latest"
            if [ -z "$DOCKERHUB_USERNAME" ]; then
              echo "DOCKERHUB_USERNAME tidak diset, menggunakan image lokal..."
              IMAGE_NAME="${TARGET_REPO_NAME}:latest"
            else
              echo "Login ke Docker Hub di server..."
              echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            fi

            # 3. Eksekusi Pull & Down
            if [ "$STRATEGY" = "docker-compose" ]; then
              echo "Menggunakan strategi Docker Compose dengan file: $COMPOSE_FILE"
              docker compose -f $COMPOSE_FILE pull
              docker compose -f $COMPOSE_FILE down
            else
              echo "Menggunakan strategi Standard Docker..."
              if [ ! -z "$DOCKERHUB_USERNAME" ]; then
                docker pull $IMAGE_NAME
              fi
              docker stop ${TARGET_REPO_NAME} || true
              docker rm ${TARGET_REPO_NAME} || true
            fi

            # 4. Jalankan Pre-Deploy Commands (jika ada)
            if [ -s /tmp/pre_deploy.sh ]; then
              echo "Menjalankan pre-deploy commands..."
              chmod +x /tmp/pre_deploy.sh
              /tmp/pre_deploy.sh
            fi
            rm -f /tmp/pre_deploy.sh

            # 5. Jalankan Container
            if [ "$STRATEGY" = "docker-compose" ]; then
              echo "Memulai container via Docker Compose..."
              docker compose -f $COMPOSE_FILE up -d
            else
              TARGET_PORT=$(grep -E "^PORT=" .env | cut -d'=' -f2)
              if [ -z "$TARGET_PORT" ]; then TARGET_PORT=80; fi
              echo "Menjalankan container pada port ${TARGET_PORT}..."
              docker run -d \
                --name ${TARGET_REPO_NAME} \
                --restart unless-stopped \
                --env-file .env \
                -p ${TARGET_PORT}:${TARGET_PORT} \
                $IMAGE_NAME
            fi

            # 6. Verifikasi Service
            sleep 3
            if [ "$STRATEGY" = "docker-compose" ]; then
              echo "Verifikasi kontainer docker compose..."
              docker compose -f $COMPOSE_FILE ps
              echo "✅ Deployment Berhasil!"
            else
              if docker ps | grep -q "${TARGET_REPO_NAME}"; then
                echo "✅ Deployment Berhasil!"
              else
                echo "❌ Deployment Gagal!"
                docker logs ${TARGET_REPO_NAME} || true
                exit 1
              fi
            fi

            # 7. Jalankan Post-Deploy Commands (jika ada)
            if [ -s /tmp/post_deploy.sh ]; then
              echo "Menjalankan post-deploy commands..."
              chmod +x /tmp/post_deploy.sh
              /tmp/post_deploy.sh
            fi
            rm -f /tmp/post_deploy.sh

