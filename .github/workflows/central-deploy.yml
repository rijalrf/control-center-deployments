name: Centralized Deployment Pipeline
on:
  workflow_dispatch:
    inputs:
      target_repo_url:
        description: 'URL Clone Repositori Target'
        required: true
      target_repo_name:
        description: 'Nama Repositori Target'
        required: true
      target_repo_path:
        description: 'Path Repositori Target (owner/repo)'
        required: true
      environment:
        description: 'Target Environment'
        required: true
      environment_secret_suffix:
        description: 'Suffix Secret Key (e.g. PRODUCTION)'
        required: true
      config:
        description: 'JSON string konfigurasi env variables'
        required: false
        default: '{}'
      server_host:
        description: 'Server IP / Host'
        required: true
      server_username:
        description: 'SSH Username'
        required: true
      dockerfile_path:
        description: 'Path ke Dockerfile (relatif terhadap root repo)'
        required: false
        default: 'Dockerfile'
      target_ref:
        description: 'Target Branch/Ref to Checkout'
        required: true
        default: 'main'
      docker_image_name:
        description: 'Nama Custom Docker Image (opsional)'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fetching Source Code from Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.target_repo_path }}
          ref: ${{ github.event.inputs.target_ref }}
          token: ${{ secrets.GIT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate Modified Docker Compose File
        id: compose_gen
        run: |
          STRATEGY=$(python3 -c "import json, os; d=json.loads(os.environ.get('CONFIG_JSON', '{}')); print(d.get('DEPLOY_STRATEGY', 'standard'))")
          if [ "$STRATEGY" = "docker-compose" ]; then
            python3 -m pip install pyyaml
            CONFIG_JSON='${{ github.event.inputs.config }}' DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}' TARGET_REPO_NAME='${{ github.event.inputs.target_repo_name }}' DOCKER_IMAGE_NAME='${{ github.event.inputs.docker_image_name }}' python3 -c '
          import os, json, yaml, base64

          config_str = os.environ.get("CONFIG_JSON", "{}")
          config = json.loads(config_str)
          db_user = os.environ.get("DOCKERHUB_USERNAME", "")
          repo_name = os.environ.get("TARGET_REPO_NAME", "")
          custom_image = os.environ.get("DOCKER_IMAGE_NAME", "")
          version_tag = config.get("VERSION_TAG", "")
          compose_file = config.get("COMPOSE_FILE", "docker-compose.yml")

          if not version_tag:
              version_tag = "latest"

          # Determine base image name matching building step logic
          if custom_image:
              base_img_name = custom_image
              if ":" in base_img_name:
                  last_colon_idx = base_img_name.rfind(":")
                  last_slash_idx = base_img_name.rfind("/")
                  if last_colon_idx > last_slash_idx:
                      base_img_name = base_img_name[:last_colon_idx]
              if "/" not in base_img_name and db_user:
                  base_img_name = f"{db_user}/{base_img_name}"
          else:
              if db_user:
                  base_img_name = f"{db_user}/{repo_name}"
              else:
                  base_img_name = f"local/{repo_name}"

          expected_image = f"{base_img_name}:{version_tag}"

          if not os.path.exists(compose_file):
              print(f"File {compose_file} tidak ditemukan di root, mencari di lokasi umum...")
              # Search common locations similar to backend findFile logic
              dirs = ["", ".docker/", "docker/", "deploy/", "deployment/", "infra/", "infrastructure/", "config/"]
              found = False
              for d in dirs:
                  for name in ["docker-compose.yml", "docker-compose.yaml"]:
                      p = os.path.join(d, name)
                      if os.path.exists(p):
                          compose_file = p
                          found = True
                          print(f"Ditemukan compose file di: {compose_file}")
                          break
                  if found: break
              
              if not found:
                  raise Exception(f"Tidak dapat menemukan docker-compose.yml atau docker-compose.yaml di repositori ini.")

          with open(compose_file, "r") as f:
              data = yaml.safe_load(f)

          if not data or "services" not in data:
              raise Exception(f"File {compose_file} tidak valid atau tidak memiliki key services")

          print(f"Memodifikasi {compose_file} untuk menggunakan image {expected_image}...")

          for s_name, s_data in data["services"].items():
              if not s_data:
                  continue
              s_data["env_file"] = [".env"]
              image_val = s_data.get("image", "")
              if image_val:
                  is_match = False
                  if db_user and db_user in image_val:
                      is_match = True
                  elif repo_name and repo_name in image_val:
                      is_match = True
                  elif custom_image and custom_image in image_val:
                      is_match = True
                      
                  if is_match:
                      s_data["image"] = expected_image
              else:
                  # If there is no image key but a build configuration exists, or it matches the repo name,
                  # or it is the only service, we supply the expected image so the deployment runs with it.
                  if "build" in s_data or s_name == repo_name or s_name == "app" or len(data["services"]) == 1:
                      s_data["image"] = expected_image

          modified_yaml = yaml.dump(data, default_flow_style=False)
          b64_content = base64.b64encode(modified_yaml.encode("utf-8")).decode("utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"compose_b64={b64_content}\n")
          '
          else
            echo "Standard strategy, skipping compose generation."
            echo "compose_b64=" >> $GITHUB_OUTPUT
          fi
        env:
          CONFIG_JSON: ${{ github.event.inputs.config }}

      - name: Building Application Container Image
        run: |
          CUSTOM_IMAGE="${{ github.event.inputs.docker_image_name }}"
          DHUB_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          CONFIG_JSON='${{ github.event.inputs.config }}'
          VERSION_TAG=$(echo "$CONFIG_JSON" | jq -r '.VERSION_TAG // empty')
          
          # Determine base image name
          if [ -z "$CUSTOM_IMAGE" ]; then
            BASE_NAME="${DHUB_USER:-local}/${{ github.event.inputs.target_repo_name }}"
          else
            if [[ "$CUSTOM_IMAGE" != *"/"* ]] && [ -n "$DHUB_USER" ]; then
              BASE_NAME="${DHUB_USER}/${CUSTOM_IMAGE}"
            else
              BASE_NAME="$CUSTOM_IMAGE"
            fi
            # Strip tag if it exists in CUSTOM_IMAGE to override it with VERSION_TAG
            if [[ "$BASE_NAME" == *":"* ]]; then
              BASE_NAME="${BASE_NAME%%:*}"
            fi
          fi
          
          # Append tag
          if [ -n "$VERSION_TAG" ]; then
            IMAGE_NAME="${BASE_NAME}:${VERSION_TAG}"
          else
            IMAGE_NAME="${BASE_NAME}:latest"
          fi
          
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "Membangun image docker $IMAGE_NAME untuk ${{ github.event.inputs.target_repo_name }}..."
          docker build -f ${{ github.event.inputs.dockerfile_path }} -t $IMAGE_NAME .

      - name: Uploading Image to Docker Hub Registry
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          echo "Login ke Docker Hub..."
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          echo "Pushing image ke Docker Hub..."
          docker push ${{ env.IMAGE_NAME }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Configuring Server Environment & Assets
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ github.event.inputs.server_host }}
          username: ${{ github.event.inputs.server_username }}
          key: ${{ secrets[format('SSH_KEY_{0}', github.event.inputs.environment_secret_suffix)] }}
          port: 22
          envs: CONFIG_JSON,TARGET_REPO_NAME,COMPOSE_B64
          script: |
            echo "Membaca konfigurasi..."
            DEPLOY_DIR=$(python3 -c "import json, os; d=json.loads(os.environ.get('CONFIG_JSON', '{}')); print(d.get('DEPLOY_DIR', '/app/${TARGET_REPO_NAME}'))")
            STRATEGY=$(python3 -c "import json, os; d=json.loads(os.environ.get('CONFIG_JSON', '{}')); print(d.get('DEPLOY_STRATEGY', 'standard'))")
            COMPOSE_FILE=$(python3 -c "import json, os; d=json.loads(os.environ.get('CONFIG_JSON', '{}')); print(d.get('COMPOSE_FILE', 'docker-compose.yml'))")

            echo "Menyiapkan direktori aplikasi: $DEPLOY_DIR..."
            mkdir -p "$DEPLOY_DIR" || sudo mkdir -p "$DEPLOY_DIR"
            chown -R $USER:$USER "$DEPLOY_DIR" 2>/dev/null || sudo chown -R $USER:$USER "$DEPLOY_DIR" || true
            cd "$DEPLOY_DIR"

            echo "Menulis file .env..."
            python3 -c "import json, os; d=json.loads(os.environ.get('CONFIG_JSON', '{}')); exclude={'DEPLOY_STRATEGY', 'DEPLOY_DIR', 'COMPOSE_FILE', 'PRE_DEPLOY_COMMANDS', 'POST_DEPLOY_COMMANDS', 'DOCKERFILE_PATH'}; f=open('.env', 'w'); [f.write(f'{k}={v}\n') for k, v in d.items() if k not in exclude]"

            echo "Isi .env (masked):"
            cat .env | sed 's/=.*/=***/' || true

            if [ "$STRATEGY" = "docker-compose" ]; then
              if [ -n "$COMPOSE_B64" ]; then
                echo "Menulis file $COMPOSE_FILE dari flow..."
                echo "$COMPOSE_B64" | base64 -d > "$COMPOSE_FILE"
              else
                echo "❌ Error: Strategi docker-compose dipilih tetapi COMPOSE_B64 kosong!"
                exit 1
              fi
            fi
        env:
          CONFIG_JSON: ${{ github.event.inputs.config }}
          TARGET_REPO_NAME: ${{ github.event.inputs.target_repo_name }}
          COMPOSE_B64: ${{ steps.compose_gen.outputs.compose_b64 }}

      - name: Deploying Container & Verifying Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ github.event.inputs.server_host }}
          username: ${{ github.event.inputs.server_username }}
          key: ${{ secrets[format('SSH_KEY_{0}', github.event.inputs.environment_secret_suffix)] }}
          port: 22
          envs: TARGET_REPO_NAME,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,CONFIG_JSON,DOCKER_IMAGE_NAME
          script: |
            set -e

            # 1. Parse config JSON using Python directly from environment
            STRATEGY=$(python3 -c "import json, os; d=json.loads(os.environ.get('CONFIG_JSON', '{}')); print(d.get('DEPLOY_STRATEGY', 'standard'))")
            DEPLOY_DIR=$(python3 -c "import json, os; d=json.loads(os.environ.get('CONFIG_JSON', '{}')); print(d.get('DEPLOY_DIR', '/app/${TARGET_REPO_NAME}'))")
            COMPOSE_FILE=$(python3 -c "import json, os; d=json.loads(os.environ.get('CONFIG_JSON', '{}')); print(d.get('COMPOSE_FILE', 'docker-compose.yml'))")
            
            # Write custom scripts to files directly from env using Python (no shell escaping issues)
            python3 -c "import json, os; d=json.loads(os.environ.get('CONFIG_JSON', '{}')); open('/tmp/pre_deploy.sh', 'w').write(d.get('PRE_DEPLOY_COMMANDS', ''))"
            python3 -c "import json, os; d=json.loads(os.environ.get('CONFIG_JSON', '{}')); open('/tmp/post_deploy.sh', 'w').write(d.get('POST_DEPLOY_COMMANDS', ''))"

            echo "Menuju direktori deployment: $DEPLOY_DIR..."
            cd "$DEPLOY_DIR"

            # 2. Login Docker Hub / Parse image name and version tag
            VERSION_TAG=$(python3 -c "import json, os; d=json.loads(os.environ.get('CONFIG_JSON', '{}')); print(d.get('VERSION_TAG', ''))")
            
            IMAGE_NAME="$DOCKER_IMAGE_NAME"
            if [ -z "$IMAGE_NAME" ]; then
              if [ -n "$DOCKERHUB_USERNAME" ]; then
                IMAGE_NAME="${DOCKERHUB_USERNAME}/${TARGET_REPO_NAME}"
              else
                IMAGE_NAME="${TARGET_REPO_NAME}"
              fi
            else
              if [[ "$IMAGE_NAME" != *"/"* ]] && [ -n "$DOCKERHUB_USERNAME" ]; then
                IMAGE_NAME="${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
              fi
              # Strip tag from IMAGE_NAME if present
              if [[ "$IMAGE_NAME" == *":"* ]]; then
                IMAGE_NAME="${IMAGE_NAME%%:*}"
              fi
            fi
            
            if [ -n "$VERSION_TAG" ]; then
              IMAGE_NAME="${IMAGE_NAME}:${VERSION_TAG}"
            else
              IMAGE_NAME="${IMAGE_NAME}:latest"
            fi

            if [ -z "$DOCKERHUB_USERNAME" ]; then
              echo "DOCKERHUB_USERNAME tidak diset, menggunakan image lokal..."
            else
              echo "Login ke Docker Hub di server..."
              echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            fi

            # 3. Eksekusi Pull & Down
            if [ "$STRATEGY" = "docker-compose" ]; then
              echo "Menggunakan strategi Docker Compose dengan file: $COMPOSE_FILE"
              docker compose -f $COMPOSE_FILE pull
              docker compose -f $COMPOSE_FILE down
            else
              echo "Menggunakan strategi Standard Docker..."
              if [ ! -z "$DOCKERHUB_USERNAME" ]; then
                docker pull $IMAGE_NAME
              fi
              docker stop ${TARGET_REPO_NAME} || true
              docker rm ${TARGET_REPO_NAME} || true
            fi

            # 4. Jalankan Pre-Deploy Commands (jika ada)
            if [ -s /tmp/pre_deploy.sh ]; then
              echo "Menjalankan pre-deploy commands..."
              chmod +x /tmp/pre_deploy.sh
              /tmp/pre_deploy.sh
            fi
            rm -f /tmp/pre_deploy.sh

            # 5. Jalankan Container
            if [ "$STRATEGY" = "docker-compose" ]; then
              echo "Memulai container via Docker Compose..."
              docker compose -f $COMPOSE_FILE up -d --remove-orphans
            else
              TARGET_PORT=$(grep -E "^PORT=" .env | cut -d'=' -f2)
              if [ -z "$TARGET_PORT" ]; then TARGET_PORT=80; fi
              echo "Menjalankan container pada port ${TARGET_PORT}..."
              docker run -d \
                --name ${TARGET_REPO_NAME} \
                --restart unless-stopped \
                --env-file .env \
                -p ${TARGET_PORT}:${TARGET_PORT} \
                $IMAGE_NAME
            fi

            # 6. Verifikasi Service
            sleep 3
            if [ "$STRATEGY" = "docker-compose" ]; then
              echo "Verifikasi kontainer docker compose..."
              docker compose -f $COMPOSE_FILE ps
              # Jika docker compose ps kosong (nggak ada service jalan), kita fail
              if [ -z "$(docker compose -f $COMPOSE_FILE ps -q)" ]; then
                echo "❌ Deployment Gagal: Tidak ada container yang berjalan!"
                exit 1
              fi
              echo "✅ Deployment Berhasil!"
            else
              if docker ps | grep -q "${TARGET_REPO_NAME}"; then
                echo "✅ Deployment Berhasil!"
              else
                echo "❌ Deployment Gagal!"
                docker logs ${TARGET_REPO_NAME} || true
                exit 1
              fi
            fi

            # 7. Jalankan Post-Deploy Commands (jika ada)
            if [ -s /tmp/post_deploy.sh ]; then
              echo "Menjalankan post-deploy commands..."
              chmod +x /tmp/post_deploy.sh
              /tmp/post_deploy.sh
            fi
            rm -f /tmp/post_deploy.sh
        env:
          TARGET_REPO_NAME: ${{ github.event.inputs.target_repo_name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CONFIG_JSON: ${{ github.event.inputs.config }}
          DOCKER_IMAGE_NAME: ${{ github.event.inputs.docker_image_name }}
