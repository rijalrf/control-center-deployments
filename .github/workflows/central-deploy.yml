name: Centralized Deployment Pipeline
on:
  workflow_dispatch:
    inputs:
      target_repo_url:
        description: 'URL Clone Repositori Target'
        required: true
      target_repo_name:
        description: 'Nama Repositori Target'
        required: true
      target_repo_path:
        description: 'Path Repositori Target (owner/repo)'
        required: true
      environment:
        description: 'Target Environment'
        required: true
      environment_secret_suffix:
        description: 'Suffix Secret Key (e.g. PRODUCTION)'
        required: true
      config:
        description: 'JSON string konfigurasi env variables'
        required: false
        default: '{}'
      server_host:
        description: 'Server IP / Host'
        required: true
      server_username:
        description: 'SSH Username'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.target_repo_path }}
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Menyiapkan Konfigurasi & Build
        run: |
          echo "Menyiapkan deployment untuk ${{ github.event.inputs.target_repo_name }}"
          echo "Environment target: ${{ github.event.inputs.environment }}"
          echo "Menerapkan konfigurasi: ${{ github.event.inputs.config }}"
          
      - name: Melakukan SSH Deployment ke Server Target
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ github.event.inputs.server_host }}
          username: ${{ github.event.inputs.server_username }}
          key: ${{ secrets[format('SSH_KEY_{0}', github.event.inputs.environment_secret_suffix)] }}
          port: 22
          script: |
            echo "Koneksi SSH ke ${{ github.event.inputs.server_host }} Berhasil!"
            # Di masa depan, jalankan deployment docker di sini:
            # cd /app/${{ github.event.inputs.target_repo_name }}
            # docker build -t ${{ github.event.inputs.target_repo_name }}:latest .
            # docker stop ${{ github.event.inputs.target_repo_name }} || true
            # docker rm ${{ github.event.inputs.target_repo_name }} || true
            # docker run -d --name ${{ github.event.inputs.target_repo_name }} -p 80:80 ${{ github.event.inputs.target_repo_name }}:latest
            echo "Deployment berhasil diselesaikan!"
